/* ========================================
   全局基础样式
   ======================================== */
*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background-color: var(--bg-body);
    font-family: var(--font-family);
    font-weight: var(--font-weight);
    color: var(--text-body);
    font-size: 15px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

body[data-theme="book"] {
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(160,140,110,0.04) 3px, rgba(160,140,110,0.04) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 100%, rgba(160,140,110,0.02) 100%);
    background-attachment: fixed;
}

body[data-theme="dark"] ::selection { background: #343434; color: #cecece; }
body[data-theme="light"] ::selection { background: #C8BFB0; color: #37352F; }
body[data-theme="book"] ::selection { background: #B5A88A; color: #1A1A18; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--border-secondary) transparent; }

/* ========================================
   主题切换栏
   ======================================== */
.theme-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-primary);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.theme-bar-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.theme-btn {
    padding: 6px 18px;
    border: 1px solid var(--border-primary);
    border-radius: 6px;
    background: var(--bg-surface);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font-family);
    transition: all 0.2s ease;
    white-space: nowrap;
}
.theme-btn:hover {
    background: var(--bg-surface2);
    color: var(--text-body);
}
.theme-btn.active {
    background: var(--switch-on-bg);
    color: var(--switch-knob-on);
    border-color: var(--switch-on-bg);
    font-weight: 600;
}
.theme-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-surface2);
    color: var(--text-muted);
    margin-left: 4px;
}

/* ========================================
   主布局容器
   ======================================== */
.page-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 64px 24px 120px;
}

/* ========================================
   分区标题
   ======================================== */
.section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0 20px;
}
.section-header:first-of-type { margin-top: 8px; }
.section-header .section-line {
    flex: 1;
    height: 1px;
    background: var(--border-primary);
}
.section-header .section-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
}
.section-header .section-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-left: 4px;
}
.section-badge.badge-fr { background: #1A2E1A; color: #80E040; }
.section-badge.badge-ds { background: #0E1A28; color: #4898FF; }
.section-badge.badge-wb { background: #E8E0D0; color: #2C2C2C; }

/* ========================================
   颜色卡片网格
   ======================================== */
.color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
}

.color-card {
    position: relative;
    background: var(--bg-surface);
    border: 1px solid var(--border-primary);
    border-radius: 8px;
    padding: 16px;
    transition: all 0.25s ease;
    cursor: pointer;
    overflow: hidden;
}

.color-card:hover {
    border-color: var(--border-secondary);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.color-card .card-tag {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    opacity: 0.7;
}

.color-card .card-sample {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
}

.color-card .card-desc {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted2);
    padding-top: 8px;
    border-top: 1px solid var(--border-primary);
    margin-top: 8px;
}

.color-card .card-copy-hint {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.2s ease;
    text-align: right;
    letter-spacing: 0.5px;
}
.color-card:hover .card-copy-hint { opacity: 0.7; }

.color-card.copied {
    border-color: var(--mud-hig) !important;
    box-shadow: 0 0 12px rgba(0,255,0,0.15);
}

/* 颜色指示圆点 */
.color-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    background: currentColor;
}

/* ========================================
   浮动字体预览窗口
   ======================================== */
.floating-picker {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    width: 100%;
    max-width: 960px;
    background: var(--bg-surface);
    border: 1px solid var(--border-primary);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.25);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.floating-picker.collapsed {
    transform: translateX(-50%) translateY(calc(100% - 42px));
}

/* 收纳/展开切换条 */
.picker-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 42px;
    cursor: pointer;
    user-select: none;
    gap: 8px;
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 1px;
    transition: color 0.2s ease;
}
.picker-toggle:hover { color: var(--text-secondary); }
.picker-toggle .toggle-arrow {
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 16px;
    line-height: 1;
}
.floating-picker.collapsed .toggle-arrow {
    transform: rotate(180deg);
}
.picker-toggle .toggle-label {
    font-weight: 600;
}

/* 面板主体 */
.picker-body {
    padding: 0 24px 24px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 20px;
    align-items: center;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease,
                padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 300px;
    opacity: 1;
}
.floating-picker.collapsed .picker-body {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
}

.picker-body .picker-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
    text-transform: uppercase;
}

.picker-body .picker-color-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.picker-body .picker-color-wrap input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid var(--border-secondary);
    cursor: pointer;
    background: transparent;
    padding: 0;
    transition: transform 0.2s ease, border-color 0.2s ease;
}
.picker-body .picker-color-wrap input[type="color"]:hover {
    transform: scale(1.1);
    border-color: var(--text-secondary);
}
.picker-body .picker-color-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.picker-body .picker-color-wrap input[type="color"]::-webkit-color-swatch {
    border-radius: 50%;
    border: none;
}
.picker-body .picker-color-wrap .hex-display {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    color: var(--text-muted2);
    letter-spacing: 0.5px;
}

.picker-body .picker-preview-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
}

.picker-body .picker-preview-area .preview-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
}

.picker-body .picker-preview-area .preview-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    padding: 10px 14px;
    background: var(--bg-body);
    border: 1px solid var(--border-primary);
    border-radius: 8px;
    min-height: 42px;
    word-break: break-all;
    transition: color 0.15s ease, opacity 0.15s ease;
}

.picker-body .picker-controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.picker-body .picker-controls-row input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 6px 10px;
    border: 1px solid var(--border-primary);
    border-radius: 6px;
    background: var(--bg-input);
    color: var(--text-body);
    font-family: var(--font-family);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s ease;
}
.picker-body .picker-controls-row input[type="text"]:focus {
    border-color: var(--border-secondary);
}

.picker-body .picker-controls-row label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}

.picker-body .picker-controls-row input[type="range"] {
    width: 70px;
    accent-color: var(--switch-on-bg);
}

.picker-body .picker-controls-row .size-val {
    font-size: 11px;
    color: var(--text-muted2);
    min-width: 32px;
    text-align: right;
}

/* 预设颜色快捷选择 */
.picker-body .preset-chips {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}
.preset-chip {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}
.preset-chip:hover {
    transform: scale(1.2);
    border-color: var(--text-secondary);
}
.preset-chip.selected {
    border-color: var(--text-body);
    box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--text-body);
}

/* ========================================
   响应式
   ======================================== */
@media (max-width: 640px) {
    .page-container { padding: 56px 12px 140px; }

    .color-card .card-sample { font-size: 15px; }
    .floating-picker { max-width: 100%; border-radius: 10px 10px 0 0; }

    .picker-body .picker-controls-row { flex-direction: column; align-items: stretch; }
    .picker-body .picker-controls-row input[type="text"] { min-width: 0; }
    .theme-btn { padding: 4px 10px; font-size: 11px; }
}

@media (max-width: 380px) {
    .color-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

            </div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-copy-hint">点击复制标签</div>
        </div>`;
}

document.getElementById('basicGrid').innerHTML = BASIC_COLORS.map(createColorCard).join('');
document.getElementById('highlightGrid').innerHTML = HIGHLIGHT_COLORS.map(createColorCard).join('');
document.getElementById('forestGrid').innerHTML = FOREST_COLORS.map(createColorCard).join('');
document.getElementById('oceanGrid').innerHTML = OCEAN_COLORS.map(createColorCard).join('');
document.getElementById('inkGrid').innerHTML = INK_COLORS.map(createColorCard).join('');

// ========================================
// 渲染预设色片
// ========================================
function renderPresetChips() {
    const styles = getComputedStyle(document.body);
    // 主题色用 CSS 变量读取
    const themeColors = [...BASIC_COLORS, ...HIGHLIGHT_COLORS].map(c => {
        const varName = '--mud-' + c.cssClass.replace('nc-', '');
        const hex = styles.getPropertyValue(varName).trim();
        return { label: c.label, hex, tag: c.tag };
    });
    // 固定色从预定义列表中取
    const fixedColors = [
        // Forest
        { hex: '#8FBC8F', label: 'FR-NOR', tag: '<fr-nor>' },
        { hex: '#80E040', label: 'FR-HIG', tag: '<fr-hig>' },
        { hex: '#FF7060', label: 'FR-HIR', tag: '<fr-hir>' },
        { hex: '#60A0F0', label: 'FR-HIB', tag: '<fr-hib>' },
        { hex: '#B870E0', label: 'FR-HIZ', tag: '<fr-hiz>' },
        // Deep Sea
        { hex: '#A0C4D8', label: 'DS-NOR', tag: '<ds-nor>' },
        { hex: '#50E870', label: 'DS-HIG', tag: '<ds-hig>' },
        { hex: '#FF7070', label: 'DS-HIR', tag: '<ds-hir>' },
        { hex: '#4898FF', label: 'DS-HIB', tag: '<ds-hib>' },
        { hex: '#A868E8', label: 'DS-HIZ', tag: '<ds-hiz>' },
        // Ink
        { hex: '#2C2C2C', label: 'WB-NOR', tag: '<wb-nor>' },
        { hex: '#2D8030', label: 'WB-HIG', tag: '<wb-hig>' },
        { hex: '#CC3030', label: 'WB-HIR', tag: '<wb-hir>' },
        { hex: '#6030A0', label: 'WB-HIZ', tag: '<wb-hiz>' },
    ];
    const all = [...themeColors, ...fixedColors];
    const chips = all.map(c =>
        `<span class="preset-chip" style="background:${c.hex};" title="${c.label} — ${c.hex}" data-hex="${c.hex}" onclick="pickPreset('${c.hex}')"></span>`
    ).join('');
    document.getElementById('presetChips').innerHTML = chips;
}

// 初始渲染
setTimeout(renderPresetChips, 50);

// ========================================
// 自定义颜色预览
// ========================================
function updateCustomPreview() {
    const color = document.getElementById('customColor').value;
    const text = document.getElementById('customText').value || '预览文本';
    const fontSize = document.getElementById('fontSizeSlider').value;
    const opacity = document.getElementById('opacitySlider').value;

    const previewEl = document.getElementById('previewTextEl');
    previewEl.style.color = color;
    previewEl.textContent = text;
    previewEl.style.fontSize = fontSize + 'px';
    previewEl.style.opacity = (opacity / 100).toString();

    document.getElementById('hexDisplay').textContent = color.toUpperCase();
    document.getElementById('sizeVal').textContent = fontSize + 'px';
    document.getElementById('opacityVal').textContent = opacity + '%';

    document.querySelectorAll('.preset-chip').forEach(chip => {
        chip.classList.toggle('selected', chip.dataset.hex.toUpperCase() === color.toUpperCase());
    });
}

// ========================================
// 浮动窗口收纳/展开
// ========================================
function togglePicker() {
    const panel = document.getElementById('floatingPicker');
    const label = document.getElementById('toggleLabel');
    panel.classList.toggle('collapsed');
    if (panel.classList.contains('collapsed')) {
        label.textContent = '字体预览 ▸';
    } else {
        label.textContent = '字体预览';
    }
}

function pickPreset(hex) {
    document.getElementById('customColor').value = hex;
    updateCustomPreview();
}

// ========================================
// 主题切换
// ========================================
function switchTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
    });
    setTimeout(renderPresetChips, 100);
    updateCustomPreview();
}

// ========================================
// 点击卡片复制完整颜色标签对
// ========================================
document.querySelectorAll('.color-card').forEach(card => {
    card.addEventListener('click', function() {
        const tagEl = this.querySelector('.card-tag');
        if (!tagEl) return;
        // 从显示文本中提取标签名: 文本如 "<blk>"（已解码）→ 剥离尖括号得 "blk"
        const displayTag = tagEl.textContent || '';
        const rawTag = displayTag.replace(/^<|>$/g, '');
        if (!rawTag) return;
        const fullTag = `<${rawTag}>`;
        navigator.clipboard.writeText(fullTag).then(() => {
            this.classList.add('copied');
            setTimeout(() => { this.classList.remove('copied'); }, 600);
        }).catch(() => {});
    });
    card.title = '点击复制标签';
});

// 初始化自定义预览
updateCustomPreview();
</script>
